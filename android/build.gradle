group 'com.example.advanced_haptics'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Recent Flutter versions apply the Kotlin Gradle plugin to every plugin
// subproject themselves (and warn when a plugin also applies it, because AGP 9
// ships built-in Kotlin support). Older Flutter versions do not, so apply it
// only when nobody else has.
if (!project.plugins.hasPlugin('org.jetbrains.kotlin.android') && !project.plugins.hasPlugin('kotlin-android')) {
    project.plugins.apply('org.jetbrains.kotlin.android')
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.example.advanced_haptics'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        // Keep low so host apps are not forced to API 26; amplitude control and
        // predefined effects are gated at runtime (API 26 / 29) in Kotlin.
        minSdkVersion 21
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}
